<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>シフト表</title>
</head>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #f5f5f5;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-weight: bold;
  }

  input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 5px;
  }

  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .night {
    color: #ff3b30;
    font-weight: bold;
  }

  .day {s
    color: #34c759;
  }
</style>

<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>

<ul id="shiftList"></ul>

<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];

let shifts = [];

function generateShifts() {
  shifts = [];
  const days = 30;

  for (let i = 0; i < days; i++) {
    const date = new Date();
    date.setDate(date.getDate() + i);

    const night = staffList[Math.floor(Math.random() * staffList.length)];

    const day1 = staffList[Math.floor(Math.random() * staffList.length)];
    const day2 = staffList[Math.floor(Math.random() * staffList.length)];

    shifts.push({ date, type: "夜勤", staff: night.name });
    shifts.push({ date, type: "日勤", staff: day1.name });
    shifts.push({ date, type: "日勤", staff: day2.name });
  }

  render();
  saveShifts();
}

function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  shifts.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${s.date.toLocaleDateString()} / ${s.type} / ${s.staff}`;
    list.appendChild(li);
  });
}
// 保存
function saveShifts() {
  localStorage.setItem("shifts", JSON.stringify(shifts));
}

// 読み込み
function loadShifts() {
  const data = localStorage.getItem("shifts");
  if (data) {
    shifts = JSON.parse(data).map(s => ({
      ...s,
      date: new Date(s.date)
    }));
    render();
  }
}

</script>

</body>
</html>
