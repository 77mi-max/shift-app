<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>シフト表</title>
</head>
<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>

<ul id="shiftList"></ul>

<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];

let shifts = [];

function generateShifts() {
  shifts = [];
  const days = 30;

  for (let i = 0; i < days; i++) {
    const date = new Date();
    date.setDate(date.getDate() + i);

    const night = staffList[Math.floor(Math.random() * staffList.length)];

    const day1 = staffList[Math.floor(Math.random() * staffList.length)];
    const day2 = staffList[Math.floor(Math.random() * staffList.length)];

    shifts.push({ date, type: "夜勤", staff: night.name });
    shifts.push({ date, type: "日勤", staff: day1.name });
    shifts.push({ date, type: "日勤", staff: day2.name });
  }

  render();
}

function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  shifts.forEach(s => {
    const li = document.createElement("li");
    li.textContent = `${s.date.toLocaleDateString()} / ${s.type} / ${s.staff}`;
    list.appendChild(li);
  });
}
</script>

</body>
</html>
