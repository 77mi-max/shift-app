<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    
    <title>シフト表</title>
<style>
  .today {
  background: #fff3cd;
  border-radius: 6px;
}

.row {
  display: flex;
  gap: 6px;
  align-items: stretch;
}

.name-col {
  width: 80px;
  font-weight: bold;
  background: #eee;
  padding: 6px;
  border-radius: 6px;
  text-align: center;
}

.cell {
  min-width: 60px;
  background: white;
  border-radius: 6px;
  padding: 4px;
  text-align: center;
  font-size: 11px;
}

  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #f5f5f5;
    margin: 0;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-weight: bold;
  }

  input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 5px;
  }

  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .night {
    color: #ff3b30;
    font-weight: bold;
  }

.day {
  color: #34c759;
}
#shiftList {
  overflow: auto;
  max-height: 80vh;
}

.header {
  position: sticky;
  top: 0;
  z-index: 3;
}

.name-col {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #eee;
}

.header-cell {
  background: #ddd;
  font-weight: bold;
  z-index: 4;
}

.header .name-col {
  z-index: 5;
}
.day-card {
  min-width: 120px;
  flex-shrink: 0;
  background: white;
  padding: 10px;
  border-radius: 10px;
}
@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .day-card {
    font-size: 10px;
    min-height: 80px;
  }

  button,
  select {
    width: 100%;
    margin-bottom: 8px;
  }
}
</style>
</head>
<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>
<div style="display:flex; gap:10px; margin-bottom:10px;">
  <select id="staffFilter" onchange="render()">
    <option value="all">全員</option>
    <option value="Aさん">Aさん</option>
    <option value="Bさん">Bさん</option>
    <option value="Cさん">Cさん</option>
    <option value="Dさん">Dさん</option>
  </select>

  <select id="typeFilter" onchange="render()">
    <option value="all">すべて</option>
    <option value="夜勤">夜勤だけ</option>
    <option value="日勤">日勤だけ</option>
  </select>
</div>

<div id="shiftList"></div>

<div id="selector" style="display:none; position:fixed; background:white; border-radius:10px; padding:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); z-index:999;">
  <button onclick="selectShift('日勤')">日勤</button>
  <button onclick="selectShift('夜勤')">夜勤</button>
  <button onclick="selectShift('空白')">削除</button>
</div>
<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];

let shifts = [];
let currentEdit = null;

// ===== シフト自動生成 =====
function generateShifts() {
  shifts = [];
  const days = 30;

  const start = new Date();
  start.setDate(1);

  for (let i = 0; i < days; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);

    const shuffled = [...staffList].sort(() => Math.random() - 0.5);

    shifts.push({ date: date.toISOString(), type: "夜勤", staff: shuffled[0].name });
    shifts.push({ date: date.toISOString(), type: "日勤", staff: shuffled[1].name });
    shifts.push({ date: date.toISOString(), type: "日勤", staff: shuffled[2].name });
  }

  saveShifts();
  render();
}

// ===== セレクター表示 =====
function openSelector(x, y, shiftData) {
  const selector = document.getElementById("selector");
  selector.style.display = "block";
  selector.style.left = x + "px";
  selector.style.top = y + "px";

  currentEdit = shiftData;
}

// ===== シフト選択（追加・編集・削除）=====
function selectShift(type) {
  if (!currentEdit) return;

  const { date, staff, oldType } = currentEdit;

  // 🔥 同じ場所の既存データ削除
  shifts = shifts.filter(x =>
    !(
      new Date(x.date).toDateString() === new Date(date).toDateString() &&
      x.staff === staff &&
      x.type === oldType
    )
  );

  // 🔥 新規追加（空白じゃない場合）
  if (type !== "空白") {
    shifts.push({
      date: date,
      staff: staff,
      type: type
    });
  }

  document.getElementById("selector").style.display = "none";
  currentEdit = null;

  saveShifts();
  render();
}

// ===== 表示 =====
function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  if (shifts.length === 0) return;
  const staffFilter = document.getElementById("staffFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;
  const baseDate = new Date(shifts[0].date);
  const year = baseDate.getFullYear();
  const month = baseDate.getMonth();
  const totalDays = new Date(year, month + 1, 0).getDate();

  const grouped = {};
  shifts.forEach(s => {
    const key = new Date(s.date).toDateString();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(s);
  });

  // ===== ヘッダー =====
  const headerRow = document.createElement("div");
  headerRow.className = "row header";

  const empty = document.createElement("div");
  empty.className = "name-col header-cell";
  headerRow.appendChild(empty);

  for (let d = 1; d <= totalDays; d++) {
  const date = new Date(year, month, d);
  const key = date.toDateString();

  const cell = document.createElement("div");
  cell.className = "cell header-cell";

  const count = (grouped[key] || []).length;

  cell.innerHTML = `
    <div>${d}</div>
    <div style="font-size:10px;">${count}人</div>
  `;

  headerRow.appendChild(cell); // ←これは絶対必要
}

  list.appendChild(headerRow);

  // ===== 本体 =====
  staffList.forEach(staff => {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("div");
    name.className = "name-col";
    const nightCount = shifts.filter(s => s.staff === staff.name && s.type === "夜勤").length;
    const dayCount = shifts.filter(s => s.staff === staff.name && s.type === "日勤").length;

name.innerHTML = `
  ${staff.name}<br>
  <span style="font-size:10px;">
    日勤:${dayCount} / 夜勤:${nightCount}
  </span>
`;  
    
    row.appendChild(name);

    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(year, month, d);
      const key = date.toDateString();

      const cell = document.createElement("div");
      cell.className = "cell";

      const today = new Date().toDateString();
if (date.toDateString() === today) {
  cell.classList.add("today");
}


const dayShifts = (grouped[key] || []).filter(s => {
  const matchStaff =
    staffFilter === "all" || s.staff === staffFilter;

  const matchType =
    typeFilter === "all" || s.type === typeFilter;

  return matchStaff && matchType && s.staff === staff.name;
});

      dayShifts.forEach(s => {
        const text = document.createElement("div");
        text.className = s.type === "夜勤" ? "night" : "day";
        text.textContent = s.type;

        // 編集クリック
        text.onclick = (e) => {
          e.stopPropagation();
          openSelector(e.pageX, e.pageY, {
            date: s.date,
            staff: s.staff,
            oldType: s.type
          });
        };

        cell.appendChild(text);
      });

      // 新規追加クリック
      cell.onclick = (e) => {
        openSelector(e.pageX, e.pageY, {
          date: date.toISOString(),
          staff: staff.name,
          oldType: null
        });
      };

      row.appendChild(cell);
    }

    list.appendChild(row);
  });
}

// ===== 保存 =====
function saveShifts() {
  localStorage.setItem("shifts", JSON.stringify(shifts));
}

// ===== 読み込み =====
function loadShifts() {
  const data = localStorage.getItem("shifts");
  if (data) shifts = JSON.parse(data);
  render();
}

// ===== 初期化 =====
window.onload = () => {
  loadShifts();
};
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
  </script>

</body>
</html>
