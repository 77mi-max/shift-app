<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフトAI</title>

<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; }
td,th { border:1px solid #ccc; padding:6px; text-align:center; }
.weekend { background:#fff9c4; }
.shift-夜 { background:#1976d2; color:white; }
.shift-休 { background:#f8bbd0; }
.total { background:#eee; font-weight:bold; }
.controls { margin-bottom:10px; }
li { cursor:grab; }
</style>
</head>

<body>

<h2>シフト表</h2>

<div class="controls">
  年：<select id="yearSelect"></select>
  月：<select id="monthSelect"></select>
  <button onclick="changeMonth()">変更</button>
</div>

<div class="controls">
  <input id="newName" placeholder="名前追加">
  <button onclick="addName()">追加</button>
</div>

<ul id="nameList"></ul>

<button onclick="generateAI()">AI生成</button>

<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>

<script>
let names=["佐藤","山田","田中"];
let shifts={};
let dragIndex=null;

let currentYear=new Date().getFullYear();
let currentMonth=new Date().getMonth();
let daysInMonth=getDays(currentYear,currentMonth);

function getKey(){ return `shift_${currentYear}_${currentMonth}`; }
function getDays(y,m){ return new Date(y,m+1,0).getDate(); }

function init(){
  for(let y=2026;y<=2035;y++) yearSelect.innerHTML+=`<option value="${y}">${y}</option>`;
  for(let m=0;m<12;m++) monthSelect.innerHTML+=`<option value="${m}">${m+1}</option>`;

  yearSelect.value=currentYear;
  monthSelect.value=currentMonth;

  load();
  initMonthData();
  render();
}

function changeMonth(){
  save();
  currentYear=parseInt(yearSelect.value);
  currentMonth=parseInt(monthSelect.value);
  daysInMonth=getDays(currentYear,currentMonth);
  load();
  initMonthData();
  render();
}

function initMonthData(){
  names.forEach(n=>{
    if(!shifts[n]||shifts[n].length!==daysInMonth){
      shifts[n]=Array(daysInMonth).fill("");
    }
  });
}

function save(){
  localStorage.setItem(getKey(),JSON.stringify(shifts));
  localStorage.setItem("names",JSON.stringify(names));
}

function load(){
  const d=JSON.parse(localStorage.getItem(getKey()));
  const n=JSON.parse(localStorage.getItem("names"));
  if(n) names=n;
  shifts=d||{};
}

function isHoliday(d){
  const day=new Date(currentYear,currentMonth,d+1).getDay();
  return day===0||day===6;
}

function render(){
  renderNameList();

  let th="<tr><th></th>";
  for(let d=0;d<daysInMonth;d++){
    const cls=isHoliday(d)?"weekend":"";
    th+=`<th class="${cls}">${d+1}</th>`;
  }
  th+="</tr>";
  thead.innerHTML=th;

  let body="";

  names.forEach(n=>{
    body+=`<tr><th>${n}</th>`;
    for(let d=0;d<daysInMonth;d++){
      const s=shifts[n][d]||"";
      let cls=[];
      if(isHoliday(d)) cls.push("weekend");
      if(s==="夜") cls.push("shift-夜");
      if(s==="休") cls.push("shift-休");
      const display=(s==="明")?"/":s;
      body+=`<td class="${cls.join(" ")}" onclick="clickCell('${n}',${d})">${display}</td>`;
    }
    body+="</tr>";
  });

  tbody.innerHTML=body;
  save();
}

function clickCell(n,d){
  const order=["","早","遅","夜","休"];
  let cur=shifts[n][d]||"";
  let next=order[(order.indexOf(cur)+1)%order.length];
  shifts[n][d]=next;
  if(next==="夜"&&d+1<daysInMonth){
    shifts[n][d+1]="明";
  }
  render();
}

function addName(){
  const name=newName.value.trim();
  if(!name) return;
  names.push(name);
  shifts[name]=Array(daysInMonth).fill("");
  newName.value="";
  render();
}

function removeName(n){
  names=names.filter(x=>x!==n);
  delete shifts[n];
  render();
}

// ===== ドラッグ並び替え =====
function renderNameList(){
  nameList.innerHTML="";
  names.forEach((n,i)=>{
    nameList.innerHTML+=`<li draggable="true" 
      ondragstart="dragStart(${i})"
      ondragover="dragOver(event)"
      ondrop="drop(${i})">
      ${n}
      <button onclick="removeName('${n}')">削除</button>
    </li>`;
  });
}

function dragStart(i){ dragIndex=i; }
function dragOver(e){ e.preventDefault(); }

function drop(i){
  const moved=names.splice(dragIndex,1)[0];
  names.splice(i,0,moved);
  render();
}

function generateAI(){
  names.forEach(n=>{
    shifts[n]=Array(daysInMonth).fill("");
  });
  const types=["早","遅","夜"];
  for(let i=0;i<2000;i++){
    const n=names[Math.random()*names.length|0];
    const d=Math.random()*daysInMonth|0;
    if(!shifts[n][d]){
      shifts[n][d]=types[Math.random()*types.length|0];
    }
  }
  render();
}

init();
</script>

</body>
</html>
