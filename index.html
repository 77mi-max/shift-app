<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト表（修正版）</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont;padding:20px;background:#f5f5f5;margin:0}
h1{margin-bottom:10px}
button{padding:10px 14px;border:none;border-radius:8px;background:#007aff;color:#fff;font-weight:bold}
select{padding:8px;border-radius:6px;border:1px solid #ccc;margin-right:5px}

.row{display:flex;margin:0}
.name-col{position:sticky;left:0;z-index:2;background:#eee;padding:6px;text-align:center;width:60px;min-width:60px;border:1px solid #ccc}
.cell{min-width:60px;height:50px;display:flex;justify-content:center;align-items:center;border:1px solid #ccc;font-size:12px;flex-direction:column}
.header-cell{background:#fff;font-weight:bold}
.header{position:sticky;top:0;z-index:3}

.today{background:#fff3cd !important}
.sun,.sat,.holiday{background:#fff3cd}

.day{background:#ffffff;padding:2px 4px;border-radius:4px}
.night{background:#cce5ff;padding:2px 4px;border-radius:4px}
.off{background:#ffd6e7;padding:2px 4px;border-radius:4px}

#selector{display:none;position:fixed;background:#fff;padding:10px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
</style>
</head>
<body>
<h1>シフト表</h1>
<button onclick="generateShifts()">自動作成</button>
<button onclick="selectShift('休み')">休み</button>

<div style="display:flex;gap:10px;margin-bottom:10px">
<select id="staffFilter" onchange="render()">
<option value="all">全員</option>
<option>Aさん</option><option>Bさん</option><option>Cさん</option><option>Dさん</option>
</select>
<select id="typeFilter" onchange="render()">
<option value="all">すべて</option>
<option>夜勤</option><option>日勤</option>
</select>
</div>

<div id="shiftList"></div>
<div id="selector">
<button onclick="selectShift('日勤')">日勤</button>
<button onclick="selectShift('夜勤')">夜勤</button>
<button onclick="selectShift('空白')">削除</button>
</div>

<script>
const staffList=[{name:"Aさん"},{name:"Bさん"},{name:"Cさん"},{name:"Dさん"}];
let shifts=[];
let currentEdit=null;

async function getHolidays(y){
const r=await fetch(`https://holidays-jp.github.io/api/v1/${y}/date.json`);
return await r.json();
}

function generateShifts(){
shifts=[];
const t=new Date();
const y=t.getFullYear();
const m=t.getMonth();
const d=new Date(y,m+1,0).getDate();
const s=new Date(y,m,1);

for(let i=0;i<d;i++){
const date=new Date(s);date.setDate(s.getDate()+i);
const sh=[...staffList].sort(()=>Math.random()-0.5);
shifts.push({date:date.toISOString(),type:"夜勤",staff:sh[0].name});
shifts.push({date:date.toISOString(),type:"日勤",staff:sh[1].name});
shifts.push({date:date.toISOString(),type:"日勤",staff:sh[2].name});
}
save();render();
}

function openSelector(x,y,data){
const el=document.getElementById('selector');
el.style.display='block';el.style.left=x+'px';el.style.top=y+'px';
currentEdit=data;
}

function selectShift(type){
if(!currentEdit)return;
const {date,staff,oldType}=currentEdit;
shifts=shifts.filter(s=>!(s.date===date&&s.staff===staff&&s.type===oldType));
if(type!="空白")shifts.push({date,staff,type});
currentEdit=null;
document.getElementById('selector').style.display='none';
save();render();
}

async function render(){
const list=document.getElementById('shiftList');
list.innerHTML='';
const y=new Date().getFullYear();
const m=new Date().getMonth();
const holidays=await getHolidays(y);
const holidaySet=new Set(Object.keys(holidays));
const days=new Date(y,m+1,0).getDate();
const grouped={};
shifts.forEach(s=>{
const k=s.date.split('T')[0];
(grouped[k]=grouped[k]||[]).push(s);
});

const header=document.createElement('div');header.className='row header';
header.innerHTML='<div class="name-col header-cell"></div>';
for(let i=1;i<=days;i++){
const date=new Date(y,m,i);
const key=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
const cell=document.createElement('div');cell.className='cell header-cell';
if(holidaySet.has(key)||date.getDay()===0||date.getDay()===6)cell.classList.add('holiday');
cell.textContent=i;
header.appendChild(cell);
}
list.appendChild(header);

staffList.forEach(staff=>{
const row=document.createElement('div');row.className='row';
const name=document.createElement('div');name.className='name-col';name.textContent=staff.name;
row.appendChild(name);

for(let i=1;i<=days;i++){
const date=new Date(y,m,i);
const key=date.toDateString();
const cell=document.createElement('div');cell.className='cell';
const listShift=(grouped[key]||[]).filter(s=>s.staff===staff.name);
listShift.forEach(s=>{
const el=document.createElement('div');
el.className=s.type==='夜勤'?'night':s.type==='日勤'?'day':'off';
el.textContent=s.type;
el.onclick=e=>{e.stopPropagation();openSelector(e.pageX,e.pageY,{date:s.date,staff:s.staff,oldType:s.type});};
cell.appendChild(el);
});
cell.onclick=e=>openSelector(e.pageX,e.pageY,{date:date.toISOString(),staff:staff.name,oldType:null});
row.appendChild(cell);
}
list.appendChild(row);
});
}

function save(){localStorage.setItem('shifts',JSON.stringify(shifts));}
function load(){const d=localStorage.getItem('shifts');if(d)shifts=JSON.parse(d);render();}
window.onload=load;
</script>
</body>
</html>
