<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフト最終版</title>
<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; }
td,th { border:1px solid #ccc; padding:6px; text-align:center; }

.name { background:#f5f5f5; }

.night { background:#cce5ff; }
.holiday { background:#ffd6e7; }
.after { color:#999; }

.want { color:red; }

</style>
</head>
<body>

<h2>シフト作成</h2>

年<select id="year"></select>
月<select id="month"></select>

<br><br>

<input id="nameInput">
<button onclick="addName()">追加</button>
<button onclick="deleteName()">削除</button>

<br><br>

NGペア① <input id="ng1a"><input id="ng1b">
NGペア② <input id="ng2a"><input id="ng2b">

<br><br>

<button onclick="toggleWant()">希望休モード</button>
<button onclick="autoGenerate()">自動生成</button>

<br><br>

<div id="tableWrap"></div>

<script>
let names = [];
let roles = {};
let shifts = {};
let wants = {};
let maxWork = {};
let ngPairs = [];

let wantMode = false;

// ===== 年月 =====
for(let y=2026;y<=2035;y++){
  year.innerHTML += `<option>${y}</option>`;
}
for(let m=1;m<=12;m++){
  month.innerHTML += `<option>${m}</option>`;
}

// ===== 日数 =====
function getDays(){
  return new Date(year.value, month.value, 0).getDate();
}

// ===== 名前 =====
function addName(){
  const n = nameInput.value;
  if(!n) return;

  names.push(n);
  roles[n]="主任";
  maxWork[n]=5;
  shifts[n]=Array(getDays()).fill("");
  wants[n]=Array(getDays()).fill(false);

  save();
  render();
}

function deleteName(){
  const n = nameInput.value;
  names = names.filter(x=>x!==n);
  delete roles[n];
  delete shifts[n];
  delete wants[n];

  save();
  render();
}

// ===== NG =====
function getNG(){
  ngPairs = [
    [ng1a.value, ng1b.value],
    [ng2a.value, ng2b.value]
  ];
}

function isNG(a,b){
  return ngPairs.some(p =>
    p[0] && ((p[0]==a&&p[1]==b)||(p[0]==b&&p[1]==a))
  );
}

// ===== 連勤 =====
function streak(n,d){
  let c=0;
  for(let i=d-1;i>=0;i--){
    if(shifts[n][i] && shifts[n][i]!=="休" && shifts[n][i]!=="/"){
      c++;
    } else break;
  }
  return c;
}

// ===== 自動生成 =====
function autoGenerate(){
  getNG();
  const days = getDays();

  names.forEach(n=>{
    shifts[n]=Array(days).fill("休");
  });

  for(let d=0; d<days; d++){

    // 夜勤
    let count=0;
    let arr=[...names].sort(()=>Math.random()-0.5);

    for(let n of arr){
      if(count>=1) break;

      if(roles[n]==="師長") continue;
      if(wants[n][d]) continue;
      if(streak(n,d)>=maxWork[n]) continue;
      if(shifts[n][d]!=="休") continue;

      let ng = names.some(o =>
        shifts[o][d]==="夜" && isNG(n,o)
      );
      if(ng) continue;

      shifts[n][d]="夜";
      count++;

      if(d+1<days) shifts[n][d+1]="/";
    }

    // 日勤
    count=0;
    arr=[...names].sort(()=>Math.random()-0.5);

    for(let n of arr){
      if(count>=2) break;

      if(wants[n][d]) continue;
      if(streak(n,d)>=maxWork[n]) continue;
      if(shifts[n][d]!=="休") continue;

      let ng = names.some(o =>
        shifts[o][d]==="日" && isNG(n,o)
      );
      if(ng) continue;

      shifts[n][d]="日";
      count++;
    }
  }

  save();
  render();
}

// ===== クリック =====
function clickCell(n,d){
  if(shifts[n][d]==="/") return;

  if(wantMode){
    wants[n][d]=!wants[n][d];
    shifts[n][d]="休";
  } else {
    const list=["休","日","夜"];
    let cur=shifts[n][d];
    let next=list[(list.indexOf(cur)+1)%list.length];

    shifts[n][d]=next;

    if(next==="夜"){
      if(d+1<getDays()) shifts[n][d+1]="/";
    }
  }

  save();
  render();
}

function toggleWant(){
  wantMode=!wantMode;
}

// ===== 合計 =====
function count(n,type){
  return shifts[n].filter(v=>v===type).length;
}

// ===== 描画 =====
function render(){
  const days=getDays();

  let html="<table><tr><th>名前</th>";

  for(let d=0;d<days;d++){
    html+=`<th>${d+1}</th>`;
  }
  html+="<th>合計</th></tr>";

  names.forEach(n=>{
    html+="<tr>";

    html+=`<td class="name">
      ${n}<br>
      <select onchange="roles['${n}']=this.value;save()">
        <option ${roles[n]=="師長"?"selected":""}>師長</option>
        <option ${roles[n]=="主任"?"selected":""}>主任</option>
      </select>
      <br>連勤<input type="number" value="${maxWork[n]}"
      onchange="maxWork['${n}']=this.value;save()">
    </td>`;

    for(let d=0;d<days;d++){
      let v=shifts[n][d];
      let cls="";
      if(v==="夜") cls="night";
      if(v==="休") cls="holiday";
      if(v==="/") cls="after";
      if(wants[n][d]) cls+=" want";

      html+=`<td class="${cls}" onclick="clickCell('${n}',${d})">${v}</td>`;
    }

    html+=`<td>${count(n,"日")+count(n,"夜")}</td>`;
    html+="</tr>";
  });

  html+="</table>";

  tableWrap.innerHTML=html;
}

// ===== 保存 =====
function save(){
  localStorage.setItem("shift",JSON.stringify({
    names,roles,shifts,wants,maxWork
  }));
}

function load(){
  const d=JSON.parse(localStorage.getItem("shift"));
  if(!d) return;

  names=d.names||[];
  roles=d.roles||{};
  shifts=d.shifts||{};
  wants=d.wants||{};
  maxWork=d.maxWork||{};
}

load();
render();
</script>

</body>
</html>
