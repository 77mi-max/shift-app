<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフトAI 完全版EX</title>

<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; }
td,th { border:1px solid #ccc; padding:6px; text-align:center; color:black; }

.weekend { background:#fff9c4; }
.day { background:#fff; }
.night { background:#1976d2; }
.off { background:#f8bbd0; }

.request { color:#e91e63; font-weight:bold; }

.panel { border:1px solid #ccc; padding:10px; margin-bottom:10px; }
</style>
</head>

<body>

<h2>シフトAI 完全版EX</h2>

年<select id="year"></select>
月<select id="month"></select>
<button onclick="changeMonth()">変更</button>

<br><br>

<input id="nameInput" placeholder="名前">
<button onclick="addName()">追加</button>

<ul id="list"></ul>

<div class="panel">
<h3>NGペア</h3>
<input id="ng1" placeholder="名前1">
<input id="ng2" placeholder="名前2">
<button onclick="addNG()">追加</button>
<div id="ngList"></div>
</div>

<div class="panel">
<h3>必要人数</h3>
<div id="needsUI"></div>
</div>

<button onclick="toggleReq()">希望休モード</button>
<button onclick="autoFill()">自動調整</button>

<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>

<script>
let names=["佐藤","山田"];
let shifts={}, request={}, rules={}, needs={}, ngPairs=[];

let year=2026, month=0;
let reqMode=false;

function getDays(){ return new Date(year,month+1,0).getDate(); }

function init(){
  for(let y=2026;y<=2035;y++) year.innerHTML+=`<option>${y}</option>`;
  for(let m=0;m<12;m++) month.innerHTML+=`<option value="${m}">${m+1}</option>`;
  render();
}

function isHoliday(d){
  let day=new Date(year,month,d+1).getDay();
  return day===0||day===6;
}

function render(){
  let days=getDays();

  list.innerHTML="";
  names.forEach((n,i)=>{
    let r=rules[n]||{maxWork:20,maxStreak:5};

    list.innerHTML+=`
    <li draggable="true" ondragstart="dragStart(${i})" ondrop="drop(${i})" ondragover="event.preventDefault()">
    ${n}
    <button onclick="removeName('${n}')">削除</button><br>
    最大<input type="number" value="${r.maxWork}" onchange="rules['${n}'].maxWork=this.value">
    連勤<input type="number" value="${r.maxStreak}" onchange="rules['${n}'].maxStreak=this.value"><br>

    <label><input type="checkbox" ${r.noNight?"checked":""} onchange="rules['${n}'].noNight=this.checked">夜勤NG</label>
    <label><input type="checkbox" ${r.noEarly?"checked":""} onchange="rules['${n}'].noEarly=this.checked">早NG</label>
    <label><input type="checkbox" ${r.noLate?"checked":""} onchange="rules['${n}'].noLate=this.checked">遅NG</label>
    <label><input type="checkbox" ${r.noWeekend?"checked":""} onchange="rules['${n}'].noWeekend=this.checked">土日NG</label>
    </li>`;
  });

  ngList.innerHTML=ngPairs.map(p=>`${p[0]}×${p[1]} <button onclick="delNG('${p[0]}','${p[1]}')">削除</button>`).join("<br>");

  let h="<tr><th></th>";
  names.forEach(n=>h+=`<th>${n}</th>`);
  h+="</tr>";
  thead.innerHTML=h;

  let b="";
  for(let d=0;d<days;d++){
    b+=`<tr><th class="${isHoliday(d)?"weekend":""}">${d+1}</th>`;
    names.forEach(n=>{
      let s=shifts[n]?.[d]||"";
      let cls="";
      if(isHoliday(d)) cls+=" weekend";
      if(["早","日","遅","明"].includes(s)) cls+=" day";
      if(s==="夜") cls+=" night";
      if(s==="休") cls+=" off";
      if(request[n]?.includes(d)) cls+=" request";

      let disp=s==="明"?"/":s;
      b+=`<td class="${cls}" onclick="clickCell('${n}',${d})">${disp}</td>`;
    });
    b+="</tr>";
  }
  tbody.innerHTML=b;

  renderNeeds();
  save();
}

function renderNeeds(){
  let days=getDays();
  let html="";
  for(let d=0;d<days;d++){
    let n=needs[d]||{早:1,日:1,遅:1,夜:1};
    html+=`${d+1}日 
    早<input value="${n.早}" size=1 onchange="setNeed(${d},'早',this.value)">
    日<input value="${n.日}" size=1 onchange="setNeed(${d},'日',this.value)">
    遅<input value="${n.遅}" size=1 onchange="setNeed(${d},'遅',this.value)">
    夜<input value="${n.夜}" size=1 onchange="setNeed(${d},'夜',this.value)"><br>`;
  }
  needsUI.innerHTML=html;
}

function setNeed(d,t,v){
  if(!needs[d]) needs[d]={早:1,日:1,遅:1,夜:1};
  needs[d][t]=parseInt(v);
  save();
}

function clickCell(n,d){
  if(reqMode){
    if(!request[n]) request[n]=[];
    if(request[n].includes(d)){
      request[n]=request[n].filter(x=>x!==d);
      shifts[n][d]="";
    }else{
      request[n].push(d);
      shifts[n][d]="休";
    }
    render();
    return;
  }

  if(shifts[n][d]==="明") return;

  let order=["","早","日","遅","夜","休"];
  let cur=shifts[n][d]||"";
  let next=order[(order.indexOf(cur)+1)%order.length];
  shifts[n][d]=next;

  if(next==="夜" && d+1<getDays()){
    shifts[n][d+1]="明";
  }

  render();
}

function autoFill(){
  let days=getDays();

  for(let d=0;d<days;d++){
    let need=needs[d]||{早:1,日:1,遅:1,夜:1};

    ["夜","早","日","遅"].forEach(type=>{
      while(count(d,type)<need[type]){
        let cands=names.filter(n=>!shifts[n]?.[d] && canAssign(n,d,type));
        if(cands.length===0) break;

        let pick=cands.sort((a,b)=>countTotal(a)-countTotal(b))[0];
        shifts[pick][d]=type;

        if(type==="夜" && d+1<days){
          shifts[pick][d+1]="明";
        }
      }
    });
  }

  render();
}

function canAssign(n,d,type){
  let r=rules[n]||{};
  if(request[n]?.includes(d)) return false;
  if(r.noNight && type==="夜") return false;
  if(r.noEarly && type==="早") return false;
  if(r.noLate && type==="遅") return false;
  if(r.noWeekend && isHoliday(d)) return false;

  if(getStreak(n,d)>=r.maxStreak) return false;

  if(ngPairs.some(p=>p.includes(n) && shifts[p[0]===n?p[1]:p[0]]?.[d])) return false;

  return true;
}

function count(d,t){ return names.filter(n=>shifts[n]?.[d]===t).length; }
function countTotal(n){ return (shifts[n]||[]).filter(x=>["早","日","遅","夜"].includes(x)).length; }

function getStreak(n,d){
  let c=0;
  for(let i=d-1;i>=0;i--){
    if(["早","日","遅","夜"].includes(shifts[n]?.[i])) c++;
    else break;
  }
  return c;
}

function addName(){
  let n=nameInput.value.trim();
  if(!n) return;
  names.push(n);
  shifts[n]=Array(getDays()).fill("");
  rules[n]={maxWork:20,maxStreak:5};
  nameInput.value="";
  render();
}

function removeName(n){
  names=names.filter(x=>x!==n);
  delete shifts[n]; delete request[n]; delete rules[n];
  render();
}

function addNG(){
  let a=ng1.value, b=ng2.value;
  if(a&&b) ngPairs.push([a,b]);
  ng1.value=ng2.value="";
  render();
}
function delNG(a,b){
  ngPairs=ngPairs.filter(p=>!(p[0]===a&&p[1]===b));
  render();
}

function toggleReq(){ reqMode=!reqMode; }

let dragI;
function dragStart(i){ dragI=i; }
function drop(i){
  let m=names.splice(dragI,1)[0];
  names.splice(i,0,m);
  render();
}

function save(){
  localStorage.setItem("shiftData",JSON.stringify({names,shifts,request,rules,needs,ngPairs,year,month}));
}
function load(){
  let d=JSON.parse(localStorage.getItem("shiftData"));
  if(!d) return;
  ({names,shifts,request,rules,needs,ngPairs,year,month}=d);
}

function changeMonth(){
  year=parseInt(yearSelect.value);
  month=parseInt(monthSelect.value);
  render();
}

load();
init();
</script>

</body>
</html>
