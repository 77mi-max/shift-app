<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    
    <title>シフト表</title>
<style>
  .today {
  background: #fff3cd;
  border-radius: 6px;
}

.row {
  display: flex;
  gap: 6px;
  align-items: stretch;
}

.name-col {
  width: 80px;
  font-weight: bold;
  background: #eee;
  padding: 6px;
  border-radius: 6px;
  text-align: center;
}

.cell {
  min-width: 60px;
  background: white;
  border-radius: 6px;
  padding: 4px;
  text-align: center;
  font-size: 11px;
}

  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #f5f5f5;
    margin: 0;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-weight: bold;
  }

  input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 5px;
  }

  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .night {
    color: #ff3b30;
    font-weight: bold;
  }

.day {
  color: #34c759;
}
#shiftList {
  overflow: auto;
  max-height: 80vh;
}

.header {
  position: sticky;
  top: 0;
  z-index: 3;
}

.name-col {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #eee;
}

.header-cell {
  background: #ddd;
  font-weight: bold;
  z-index: 4;
}

.header .name-col {
  z-index: 5;
}
.day-card {
  min-width: 120px;
  flex-shrink: 0;
  background: white;
  padding: 10px;
  border-radius: 10px;
}
@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .day-card {
    font-size: 10px;
    min-height: 80px;
  }

  button,
  select {
    width: 100%;
    margin-bottom: 8px;
  }
}
</style>
</head>
<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>
<select id="staffFilter" onchange="render()">
  <option value="all">全員</option>
  <option value="Aさん">Aさん</option>
  <option value="Bさん">Bさん</option>
  <option value="Cさん">Cさん</option>
  <option value="Dさん">Dさん</option>
</select>

<select id="typeFilter" onchange="render()">
  <option value="all">すべて</option>
  <option value="夜勤">夜勤だけ</option>
  <option value="日勤">日勤だけ</option>
</select>

<div id="shiftList" class="grid"></div>
<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];


let shifts = [];

function generateShifts() {
  shifts = [];
  const days = 30;

  const start = new Date();
  start.setDate(1); // ←月初に固定

  for (let i = 0; i < days; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);

    const shuffled = [...staffList].sort(() => Math.random() - 0.5);

    const night = shuffled[0];
    const day1 = shuffled[1];
    const day2 = shuffled[2];

shifts.push({ date: date.toISOString(), type: "夜勤", staff: night.name });
shifts.push({ date: date.toISOString(), type: "日勤", staff: day1.name });
shifts.push({ date: date.toISOString(), type: "日勤", staff: day2.name });
  }

  render();
  saveShifts();
}
// 👇 renderの外に出す
function editShift(dateKey, type, staff) {
  const newName = prompt("スタッフ名を変更", staff);
  if (!newName) return;

  shifts.forEach(s => {
    if (
      new Date(s.date).toDateString() === dateKey &&
      s.type === type &&
      s.staff === staff
    ) {
      s.staff = newName;
    }
  });

  saveShifts();
  render();
}

function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  if (shifts.length === 0) return;

  const baseDate = new Date(shifts[0].date);
  const year = baseDate.getFullYear();
  const month = baseDate.getMonth();
  const totalDays = new Date(year, month + 1, 0).getDate();

  const grouped = {};
shifts.forEach(s => {
  const key = new Date(s.date).toDateString();
  if (!grouped[key]) grouped[key] = [];
  grouped[key].push(s);
});

  // ===== 日付ヘッダー追加 =====
const headerRow = document.createElement("div");
headerRow.className = "row header";

// 左上の空白
const empty = document.createElement("div");
empty.className = "name-col header-cell";
headerRow.appendChild(empty);

// 日付
for (let d = 1; d <= totalDays; d++) {
  const cell = document.createElement("div");
  cell.className = "cell header-cell";
  cell.textContent = d;
  headerRow.appendChild(cell);
}

list.appendChild(headerRow);
  // フィルター
  const staffFilter = document.getElementById("staffFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;

  staffList.forEach(staff => {
    const row = document.createElement("div");
    row.className = "row";

    // 左の名前固定
    const name = document.createElement("div");
    name.className = "name-col";
    name.textContent = staff.name;
    row.appendChild(name);

    // 横（日付）
    for (let d = 1; d <= totalDays; d++) {
      const date = new Date(year, month, d);
      const key = date.toDateString();

      const cell = document.createElement("div");
      cell.className = "cell";

      const dayShifts = (grouped[key] || []).filter(s => {
        const matchStaff =
  (staffFilter === "all" || staff.name === staffFilter) &&
  s.staff === staff.name;
  const matchType = typeFilter === "all" || s.type === typeFilter;
  return matchStaff && matchType;
});

dayShifts.forEach(s => {
  const text = document.createElement("div");
  text.className = s.type === "夜勤" ? "night" : "day";
  text.textContent = s.type;
  cell.appendChild(text);
});

      // ドロップ対応（そのまま移動できる）
      cell.addEventListener("dragover", e => e.preventDefault());

      cell.addEventListener("drop", e => {
        e.preventDefault();
        const data = JSON.parse(e.dataTransfer.getData("text/plain"));
        moveShift(data, date);
      });

      row.appendChild(cell);
    }

    list.appendChild(row);
  });
}
function loadShifts() {
  const data = localStorage.getItem("shifts");
  if (data) {
    shifts = JSON.parse(data);
  }
  render();
}
function saveShifts() {
  localStorage.setItem("shifts", JSON.stringify(shifts));
}

function moveShift(data, newDate) {
  shifts = shifts.filter(s => {
const a = new Date(s.date).toDateString();
const b = data.dateKey;
  return !(a === b && s.type === data.type && s.staff === data.staff);
});

  shifts.push({
    date: newDate.toISOString(),
    type: data.type,
    staff: data.staff
  });

  saveShifts();
  render();
}

// ページ読み込み時
window.onload = () => {
  loadShifts();
};

</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
  </script>
</body>
</html>
