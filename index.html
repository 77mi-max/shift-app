<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>シフト表</title>
</head>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #f5f5f5;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-weight: bold;
  }

  input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 5px;
  }

  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .night {
    color: #ff3b30;
    font-weight: bold;
  }

.day {
  color: #34c759;
}
  .grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.day-card {
  min-height: 100px;
  font-size: 12px;
}
</style>

<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>
<select id="staffFilter" onchange="render()">
  <option value="all">全員</option>
  <option value="Aさん">Aさん</option>
  <option value="Bさん">Bさん</option>
  <option value="Cさん">Cさん</option>
  <option value="Dさん">Dさん</option>
</select>

<select id="typeFilter" onchange="render()">
  <option value="all">すべて</option>
  <option value="夜勤">夜勤だけ</option>
  <option value="日勤">日勤だけ</option>
</select>

<div class="grid" id="calendarHeader">
  <div>日</div>
  <div>月</div>
  <div>火</div>
  <div>水</div>
  <div>木</div>
  <div>金</div>
  <div>土</div>
</div>

<div id="shiftList" class="grid"></div>
<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];


let shifts = [];

function generateShifts() {
  shifts = [];
  const days = 30;

  const start = new Date();
  start.setDate(1); // ←月初に固定

  for (let i = 0; i < days; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);

    const shuffled = [...staffList].sort(() => Math.random() - 0.5);

    const night = shuffled[0];
    const day1 = shuffled[1];
    const day2 = shuffled[2];

shifts.push({ date: date.toISOString(), type: "夜勤", staff: night.name });
shifts.push({ date: date.toISOString(), type: "日勤", staff: day1.name });
shifts.push({ date: date.toISOString(), type: "日勤", staff: day2.name });
  }

  render();
  saveShifts();
}
// 👇 renderの外に出す
function editShift(dateKey, type, staff) {
  const newName = prompt("スタッフ名を変更", staff);
  if (!newName) return;

  shifts.forEach(s => {
    if (
      new Date(s.date).toDateString() === dateKey &&
      s.type === type &&
      s.staff === staff
    ) {
      s.staff = newName;
    }
  });

  saveShifts();
  render();
}

function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  if (shifts.length === 0) return;

  const today = new Date();
  const grouped = {};

  shifts.forEach(s => {
    const key = new Date(s.date).toDateString();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(s);
  });

  const baseDate = new Date(shifts[0].date);
  const year = baseDate.getFullYear();
  const month = baseDate.getMonth();

  const startDate = new Date(year, month, 1);
  const startDay = startDate.getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();

  for (let i = 0; i < startDay; i++) {
    list.appendChild(document.createElement("div"));
  }

  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const key = date.toDateString();

    const staffFilter = document.getElementById("staffFilter").value;
    const typeFilter = document.getElementById("typeFilter").value;

    const dayShifts = (grouped[key] || []).filter(s => {
      const matchStaff = staffFilter === "all" || s.staff === staffFilter;
      const matchType = typeFilter === "all" || s.type === typeFilter;
      return matchStaff && matchType;
    });

    const div = document.createElement("div");
    div.className = "day-card";

    if (
      date.getFullYear() === today.getFullYear() &&
      date.getMonth() === today.getMonth() &&
      date.getDate() === today.getDate()
    ) {
      div.style.background = "#fff3cd";
    }

    let html = `<strong>${d}</strong>`;

    dayShifts.forEach(s => {
      const typeClass = s.type === "夜勤" ? "night" : "day";
      html += `<div class="${typeClass}" onclick="editShift('${key}', '${s.type}', '${s.staff}')">
        ${s.type}：${s.staff}
      </div>`;
    });

    div.innerHTML = html;
    list.appendChild(div);
  }
}
  
function loadShifts() {
  const data = localStorage.getItem("shifts");
  if (data) {
    shifts = JSON.parse(data).map(s => ({
      ...s,
      date: new Date(s.date)
    }));
  }
  render();
}

// ページ読み込み時
window.onload = () => {
  loadShifts();
};

</script>

</body>
</html>
