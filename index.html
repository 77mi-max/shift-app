<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト表</title>

<style>
*{box-sizing:border-box;}
body{font-family:-apple-system;padding:20px;background:#f5f5f5;}

button,select,input{padding:6px;margin:3px;}

.row{display:flex;}
#shiftList{overflow-x:auto;}

:root{
  --cell-size: calc((100vw - 80px) / 8);
}

.cell,.header-cell{
  width:var(--cell-size);
  aspect-ratio:1/1;
  border:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:bold;
  color:#000;
  background:#fff;
}

.name-col{
  width:80px;
  min-width:80px;
  aspect-ratio:1/1;
  position:sticky;
  left:0;
  background:#fff;
}

.night{background:#cce5ff;}
.weekend{background:#fff3cd !important;}
.request{background:#ffd6e7 !important;color:#ff4d6d !important;}

.selected{outline:3px solid #007aff;}

@media(min-width:768px){
  :root{--cell-size:70px;}
}
</style>
</head>

<body>

<h2>シフト表</h2>

<input id="password" type="password" placeholder="管理者パスワード">
<button onclick="login()">ログイン</button>
<button onclick="logout()">ログアウト</button>

<br>

<select id="yearSelect"></select>
<select id="monthSelect"></select>

<br>

<button onclick="generate()">自動作成</button>
<button onclick="autoFix()">自動修正</button>
<button onclick="saveData()">保存</button>
<button onclick="loadData()">読込</button>
<button onclick="downloadCSV()">CSV</button>
<button onclick="shareURL()">共有</button>

<br>

<button onclick="sortByNight()">夜勤多い順</button>
<button onclick="sortByName()">名前順</button>

<br>

<input id="newStaff" placeholder="スタッフ名">
<button onclick="addStaff()">追加</button>

<br>

早<input type="number" id="earlyNum" value="1">
日<input type="number" id="dayNum" value="2">
遅<input type="number" id="lateNum" value="1">
夜<input type="number" id="nightNum" value="1">

<br>

<select id="staffSelect"></select>
<select id="daySelect"></select>
<button onclick="addRequest()">希望休</button>

<div id="shiftList"></div>

<div>
  <button onmousedown="currentType='早番'">○</button>
  <button onmousedown="currentType='日勤'">日</button>
  <button onmousedown="currentType='遅番'">◎</button>
  <button onmousedown="currentType='夜勤'">夜</button>
  <button onmousedown="currentType='明け'">/</button>
  <button onmousedown="currentType='休み'">休</button>
</div>

<script>

let isAdmin=false;
const ADMIN_PASSWORD="1234";
const MAX_CONSECUTIVE=5;

let staffList=["山田","佐藤","田中"];
let requestOff={},shifts={},counts={};

let selectedCell=null;
let isDragging=false;
let currentType=null;

let year=2026,month=3,days=30;

// ===== ログイン =====
function login(){
  if(document.getElementById("password").value===ADMIN_PASSWORD){
    isAdmin=true;
    alert("管理者ON");
  }else alert("NG");
}

function logout(){
  isAdmin=false;
  alert("ログアウト");
}

// ===== 日数 =====
function updateDays(){
  days=new Date(year,month+1,0).getDate();
  initDaySelect();
}

// ===== UI =====
const staffSelect=document.getElementById("staffSelect");
const daySelect=document.getElementById("daySelect");

function initUI(){
  staffSelect.innerHTML="";
  staffList.forEach(n=>{
    let o=document.createElement("option");
    o.value=n;o.textContent=n;
    staffSelect.appendChild(o);
  });
}

function initDaySelect(){
  daySelect.innerHTML="";
  for(let i=1;i<=days;i++){
    let o=document.createElement("option");
    o.value=i;o.textContent=i+"日";
    daySelect.appendChild(o);
  }
}

// 年月
const ySel=document.getElementById("yearSelect");
const mSel=document.getElementById("monthSelect");

for(let y=2024;y<=2030;y++){
  let o=document.createElement("option");
  o.value=y;o.textContent=y;
  ySel.appendChild(o);
}
ySel.value=year;

for(let m=1;m<=12;m++){
  let o=document.createElement("option");
  o.value=m-1;o.textContent=m+"月";
  mSel.appendChild(o);
}
mSel.value=month;

ySel.onchange=()=>{year=Number(ySel.value);updateDays();}
mSel.onchange=()=>{month=Number(mSel.value);updateDays();}

updateDays();initUI();

// ===== 追加 =====
function addStaff(){
  const name=document.getElementById("newStaff").value;
  if(!name) return;
  staffList.push(name);
  initUI();
}

function addRequest(){
  const n=staffSelect.value;
  const d=Number(daySelect.value);
  if(!requestOff[n]) requestOff[n]=[];
  requestOff[n].push(d);
  render();
}

// ===== 制約 =====
function canAssign(name,day,type,count,max){

  if(requestOff[name]?.includes(day)) if(type!=="休み") return false;

  if(day>1 && shifts[name][day-2]==="夜勤") return type==="明け";

  // 連勤制限
  let work=0;
  for(let i=day-1;i>=0;i--){
    if(shifts[name][i] && shifts[name][i]!=="休み") work++;
    else break;
  }
  if(work>=MAX_CONSECUTIVE && type!=="休み") return false;

  if(type==="明け") return false;
  if(type!=="休み" && count[type]>=max[type]) return false;

  return true;
}

// ===== 自動 =====
function generate(){
  const max={
    早番:+earlyNum.value,
    日勤:+dayNum.value,
    遅番:+lateNum.value,
    夜勤:+nightNum.value
  };

  shifts={};counts={};

  staffList.forEach(n=>{
    shifts[n]=[];
    counts[n]={早番:0,日勤:0,遅番:0,夜勤:0,休み:0,明け:0};
  });

  for(let d=1;d<=days;d++){
    let count={早番:0,日勤:0,遅番:0,夜勤:0};

    staffList.forEach(n=>{
      if(d>1 && shifts[n][d-2]==="夜勤"){
        shifts[n][d-1]="明け";
        counts[n].明け++;
        return;
      }

      let types=["早番","日勤","遅番","夜勤","休み"];
      for(let t of types){
        if(canAssign(n,d,t,count,max)){
          shifts[n][d-1]=t;
          counts[n][t]++;
          if(t!=="休み") count[t]++;
          break;
        }
      }
    });
  }
  render();
}

function autoFix(){generate();}

// ===== 編集 =====
function applyShift(n,i,type){
  if(!isAdmin) return;

  shifts[n][i]=type;
  render();
}

// ===== 描画 =====
function render(){
  const c=document.getElementById("shiftList");
  c.innerHTML="";

  const header=document.createElement("div");
  header.className="row";
  header.appendChild(document.createElement("div"));

  for(let i=1;i<=days;i++){
    let d=document.createElement("div");
    d.className="header-cell";
    let w=["日","月","火","水","木","金","土"][new Date(year,month,i).getDay()];
    d.innerHTML=i+"<br>"+w;
    if(w==="土"||w==="日") d.classList.add("weekend");
    header.appendChild(d);
  }
  c.appendChild(header);

  staffList.forEach(n=>{
    let row=document.createElement("div");
    row.className="row";

    let nc=document.createElement("div");
    nc.className="cell name-col";
    nc.textContent=n;
    row.appendChild(nc);

    for(let i=0;i<days;i++){
      let val=shifts[n]?.[i]||"";
      let cell=document.createElement("div");
      cell.className="cell";

      if(val==="夜勤") cell.classList.add("night");
      if(requestOff[n]?.includes(i+1)) cell.classList.add("request");

      let w=new Date(year,month,i+1).getDay();
      if(w===0||w===6) cell.classList.add("weekend");

      // 記号
      if(val==="早番") cell.innerHTML="○";
      else if(val==="遅番") cell.innerHTML="◎";
      else if(val==="夜勤") cell.innerHTML="夜";
      else if(val==="明け") cell.innerHTML="/";
      else if(val==="休み") cell.innerHTML="休";

      // 編集
      cell.onmousedown=()=>{isDragging=true;}
      cell.onmouseover=()=>{if(isDragging && currentType) applyShift(n,i,currentType);}
      cell.onclick=()=>{if(currentType) applyShift(n,i,currentType);}

      row.appendChild(cell);
    }
    c.appendChild(row);
  });

  document.body.onmouseup=()=>isDragging=false;

  // バランス表示
  let sum=document.createElement("div");
  staffList.forEach(n=>{
    let cts=counts[n]||{};
    let d=document.createElement("div");
    d.textContent=`${n} 早:${cts.早番||0} 日:${cts.日勤||0} 遅:${cts.遅番||0} 夜:${cts.夜勤||0}`;
    sum.appendChild(d);
  });
  c.appendChild(sum);
}

// ===== 並び替え =====
function sortByNight(){
  staffList.sort((a,b)=>(counts[b]?.夜勤||0)-(counts[a]?.夜勤||0));
  render();
}
function sortByName(){
  staffList.sort();
  render();
}

// ===== 共有 =====
function shareURL(){
  const data=btoa(JSON.stringify({staffList,requestOff,shifts,year,month}));
  const url=location.origin+location.pathname+"?data="+data;
  navigator.clipboard.writeText(url);
  alert("URLコピーした");
}

// ===== 保存 =====
function saveData(){
  localStorage.setItem("shiftApp",
    JSON.stringify({staffList,requestOff,shifts,year,month})
  );
}

function loadData(){
  const d=JSON.parse(localStorage.getItem("shiftApp"));
  if(!d) return;
  staffList=d.staffList;
  requestOff=d.requestOff;
  shifts=d.shifts;
  year=d.year;
  month=d.month;
  initUI();updateDays();render();
}

// URL読み込み
window.onload=()=>{
  const p=new URLSearchParams(location.search);
  if(p.get("data")){
    let d=JSON.parse(atob(p.get("data")));
    staffList=d.staffList;
    requestOff=d.requestOff;
    shifts=d.shifts;
    year=d.year;
    month=d.month;
  }
  initUI();updateDays();render();
};

</script>
</body>
</html>
