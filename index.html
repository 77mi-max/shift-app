<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    
    <title>シフト表</title>
<style>
  .today {
  background: #fff3cd !important;
}

.row {
  display: flex;
  margin: 0;
}

.name-col {
  position: sticky;
  left: 0;
  z-index: 2;
  background: #eee;
  padding: 6px;
  text-align: center;
}

.cell {
  min-width: 60px;
  height: 50px; /* ←追加 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
  body {
    font-family: -apple-system, BlinkMacSystemFont;
    padding: 20px;
    background: #f5f5f5;
    margin: 0;
  }

  h1 {
    margin-bottom: 10px;
  }

  button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #007aff;
    color: white;
    font-weight: bold;
  }

  input {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 5px;
  }

  .card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  
  .day {
  background: #ffffff; /* 白 */
  color: #000;
  border-radius: 4px;
  padding: 2px 4px;
}

.night {
  background: #cce5ff; /* 青 */
  color: #000;
  border-radius: 4px;
  padding: 2px 4px;
}

.off {
  background: #ffd6e7; /* ピンク */
  color: #000;
  border-radius: 4px;
  padding: 2px 4px;
}

#shiftList {
  overflow: auto;
  max-height: 80vh;
}

.header {
  display: flex;
}

.header-cell {
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.header .name-col {
  z-index: 5;
}
.name-col, .cell, .header-cell {
  width: 60px;
  min-width: 60px;
  box-sizing: border-box;
}
.cell, .name-col, .header-cell {
  border: 1px solid #ccc;
}

.row {
  margin: -1px 0 0 -1px;
}

.cell, .header-cell {
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
}


.day-card {
  min-width: 120px;
  flex-shrink: 0;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .day-card {
    font-size: 10px;
    min-height: 80px;
  }

  button,
  select {
    width: 100%;
    margin-bottom: 8px;
  }
}
.header {
  position: sticky;
  top: 0;
  z-index: 3;
  background: white;
}

.cell, .header-cell {
  font-size: 12px;
}

.sat, .sun, .holiday {
  background: #fff3cd; /* やわらかい黄色 */
}

.off {
  background: #eee;
  color: #666;
  border-radius: 4px;
  padding: 2px 4px;
}

</style>
</head>
<body>

<h1>シフト表</h1>

<button onclick="generateShifts()">シフト自動作成（30日）</button>
<button onclick="selectShift('休み')">休み</button>
<div style="display:flex; gap:10px; margin-bottom:10px;">
  <select id="staffFilter" onchange="render()">
    <option value="all">全員</option>
    <option value="Aさん">Aさん</option>
    <option value="Bさん">Bさん</option>
    <option value="Cさん">Cさん</option>
    <option value="Dさん">Dさん</option>
  </select>

  <select id="typeFilter" onchange="render()">
    <option value="all">すべて</option>
    <option value="夜勤">夜勤だけ</option>
    <option value="日勤">日勤だけ</option>
  </select>
</div>

<div id="shiftList"></div>

<div id="selector" style="display:none; position:fixed; background:white; border-radius:10px; padding:10px; box-shadow:0 4px 10px rgba(0,0,0,0.2); z-index:999;">
  <button onclick="selectShift('日勤')">日勤</button>
  <button onclick="selectShift('夜勤')">夜勤</button>
  <button onclick="selectShift('空白')">削除</button>
</div>
<script>
const staffList = [
  { id: 1, name: "Aさん" },
  { id: 2, name: "Bさん" },
  { id: 3, name: "Cさん" },
  { id: 4, name: "Dさん" },
];

let shifts = [];
let currentEdit = null;

async function getHolidays(year) {
  const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
  return await res.json();
}

// ===== シフト自動生成 =====
function generateShifts() {
  shifts = [];

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();

  const days = new Date(year, month + 1, 0).getDate();
  const start = new Date(year, month, 1);

  for (let i = 0; i < days; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);

    const shuffled = [...staffList].sort(() => Math.random() - 0.5);

    shifts.push({ date: date.toISOString(), type: "夜勤", staff: shuffled[0].name });
    shifts.push({ date: date.toISOString(), type: "日勤", staff: shuffled[1].name });
    shifts.push({ date: date.toISOString(), type: "日勤", staff: shuffled[2].name });
  }

  saveShifts();
  render();
}
// ===== セレクター表示 =====
function openSelector(x, y, shiftData) {
  const selector = document.getElementById("selector");
  selector.style.display = "block";
  selector.style.left = x + "px";
  selector.style.top = y + "px";

  currentEdit = shiftData;
}

// ===== シフト選択（追加・編集・削除）=====
function selectShift(type) {
  if (!currentEdit) return;

  const { date, staff, oldType } = currentEdit;

  // 🔥 同じ場所の既存データ削除
  shifts = shifts.filter(x =>
    !(
      new Date(x.date).toDateString() === new Date(date).toDateString() &&
      x.staff === staff &&
      x.type === oldType
    )
  );

  // 🔥 新規追加（空白じゃない場合）
  if (type !== "空白") {
    shifts.push({
      date: date,
      staff: staff,
      type: type
    });
  }

  document.getElementById("selector").style.display = "none";
  currentEdit = null;

  saveShifts();
  render();
}

// ===== 表示 =====
async function render() {
  const list = document.getElementById("shiftList");
  list.innerHTML = "";

  if (shifts.length === 0) return;
  const staffFilter = document.getElementById("staffFilter").value;
  const typeFilter = document.getElementById("typeFilter").value;
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const holidays = await getHolidays(year);
  const totalDays = new Date(year, month + 1, 0).getDate();

  const grouped = {};
  shifts.forEach(s => {
    const key = new Date(s.date).toDateString();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(s);
  });

  // ===== ヘッダー =====
  const headerRow = document.createElement("div");
headerRow.className = "row header";

// 左上（空白）
const empty = document.createElement("div");
empty.className = "name-col header-cell";
headerRow.appendChild(empty);

// 日付部分
for (let d = 1; d <= totalDays; d++) {
  const date = new Date(year, month, d);
  const day = date.getDay(); // 0:日曜, 6:土曜
  const holidays = [
  "2026-01-01",
  "2026-01-12"
]; // ←とりあえず手動（あとで増やせる）

const yyyyMMdd = date.toISOString().split("T")[0];

if (holidays.includes(yyyyMMdd)) {
  cell.classList.add("holiday");
}
  const key = date.toDateString();
  const cell = document.createElement("div");
  cell.className = "cell header-cell";
  if (day === 0) cell.classList.add("sun");
if (day === 6) cell.classList.add("sat");

  const count = (grouped[key] || []).length;

  cell.innerHTML = `<div>${d}</div>`;

  headerRow.appendChild(cell);
}

// 👇 右端の「合計」
const totalHeader = document.createElement("div");
totalHeader.className = "cell header-cell";
totalHeader.textContent = "合計";
headerRow.appendChild(totalHeader);

// 表に追加
list.appendChild(headerRow);

  // ===== 本体 =====
  staffList.forEach(staff => {
  const row = document.createElement("div");
  row.className = "row";

  // 👇 名前
  const name = document.createElement("div");
  name.className = "name-col";
  name.textContent = staff.name;

  row.appendChild(name);

  // 👇 日付ループ
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    const key = date.toDateString();

    const cell = document.createElement("div");
    cell.className = "cell";
    const day = date.getDay();
    const yyyyMMdd = date.toISOString().split("T")[0];

if (holidays.includes(yyyyMMdd)) {
  cell.classList.add("holiday");
}

if (day === 0) cell.classList.add("sun");
if (day === 6) cell.classList.add("sat");

    const today = new Date().toDateString();
    if (date.toDateString() === today) {
      cell.classList.add("today");
    }

    const dayShifts = (grouped[key] || []).filter(s => {
      const matchStaff =
        staffFilter === "all" || s.staff === staffFilter;

      const matchType =
        typeFilter === "all" || s.type === typeFilter;

      return matchStaff && matchType && s.staff === staff.name;
    });

    dayShifts.forEach(s => {
      const text = document.createElement("div");
      text.className =
  s.type === "夜勤" ? "night" :
  s.type === "日勤" ? "day" :
  "off";
      text.textContent = s.type;
      if (s.type === "夜勤") cell.style.background = "#cce5ff";
      if (s.type === "休み") cell.style.background = "#ffd6e7";
      if (s.type === "日勤") cell.style.background = "#ffffff";
      text.onclick = (e) => {
        e.stopPropagation();
        openSelector(e.pageX, e.pageY, {
          date: s.date,
          staff: s.staff,
          oldType: s.type
        });
      };

      cell.appendChild(text);
    });

    cell.onclick = (e) => {
      openSelector(e.pageX, e.pageY, {
        date: date.toISOString(),
        staff: staff.name,
        oldType: null
      });
    };

    row.appendChild(cell);
  }

  // 👇 ここが超重要（ループの外！！）
  const totalCell = document.createElement("div");
  totalCell.className = "cell";
  const dayCount = shifts.filter(s => s.staff === staff.name && s.type === "日勤").length;
  const nightCount = shifts.filter(s => s.staff === staff.name && s.type === "夜勤").length;
  const offCount = shifts.filter(s => s.staff === staff.name && s.type === "休み").length;
  totalCell.innerHTML = `
  <div>日勤:${dayCount}</div>
  <div>夜勤:${nightCount}</div>
  <div>休み:${offCount}</div>
`;

  row.appendChild(totalCell);

  list.appendChild(row);
});
const totalRow = document.createElement("div");
totalRow.className = "row";

// 左下「合計」
const label = document.createElement("div");
label.className = "name-col";
label.textContent = "合計";
totalRow.appendChild(label);

// 日ごとの合計
for (let d = 1; d <= totalDays; d++) {
  const date = new Date(year, month, d);
  const key = date.toDateString();

  const dayShifts = grouped[key] || [];

  const dayCount = dayShifts.filter(s => s.type === "日勤").length;
  const nightCount = dayShifts.filter(s => s.type === "夜勤").length;
  const offCount = dayShifts.filter(s => s.type === "休み").length;
  const cell = document.createElement("div");
  cell.className = "cell";

  cell.innerHTML = `
  <div>日勤:${dayCount}</div>
  <div>夜勤:${nightCount}</div>
  <div>休み:${offCount}</div>
`;

  totalRow.appendChild(cell);
}

// 右下の総合
const totalAll = document.createElement("div");
totalAll.className = "cell";

const totalDay = shifts.filter(s => s.type === "日勤").length;
const totalNight = shifts.filter(s => s.type === "夜勤").length;
const totalOff = shifts.filter(s => s.type === "休み").length;
totalAll.innerHTML = `
  <div>日:${totalDay}</div>
  <div>夜:${totalNight}</div>
  <div>休:${totalOff}</div>
`;

totalRow.appendChild(totalAll);
list.appendChild(totalRow);
}
  
// ===== 保存 =====
function saveShifts() {
  localStorage.setItem("shifts", JSON.stringify(shifts));
}

// ===== 読み込み =====
function loadShifts() {
  const data = localStorage.getItem("shifts");
  if (data) shifts = JSON.parse(data);
  render();
}

// ===== 初期化 =====
window.onload = () => {
  loadShifts();
};
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
  </script>

</body>
</html>
