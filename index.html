<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト表</title>

<style>
*{box-sizing:border-box;}
body{font-family:-apple-system;padding:20px;background:#f5f5f5;}

button,select,input{padding:8px;margin:5px;}

.row{display:flex;}

.cell,.header-cell,.name-col{
  width:75px;height:75px;border:1px solid #ccc;
  display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:11px;
}

.name-col{position:sticky;left:0;background:#fff;}
.header{position:sticky;top:0;background:#fff;}
#shiftList{overflow-x:auto;}

.early{background:#fff0cc;}
.day{background:#fff;}
.late{background:#e6ccff;}
.night{background:#cce5ff;}
.off{background:#ffd6e7;}
.ake{background:#e0ffe0;}
.weekend{background:#fff3cd;}

.request{background:#ffd6e7!important;color:red;font-weight:bold;}

@media print{
  button,select,input{display:none;}
  .cell,.header-cell,.name-col{width:55px;height:55px;}
}
</style>
</head>

<body>

<h2>シフト表</h2>

<!-- 月切り替え -->
<select id="yearSelect"></select>
<select id="monthSelect"></select>

<br>

<button onclick="generate()">自動作成</button>
<button onclick="saveData()">保存</button>
<button onclick="loadData()">読込</button>
<button onclick="downloadCSV()">CSV</button>
<button onclick="window.print()">印刷</button>

<br>

<input id="newStaff" placeholder="スタッフ名">
<button onclick="addStaff()">追加</button>

<br>

<!-- 勤務人数設定 -->
早<input type="number" id="earlyNum" value="1">
日<input type="number" id="dayNum" value="2">
遅<input type="number" id="lateNum" value="1">
夜<input type="number" id="nightNum" value="1">

<br>

<select id="staffSelect"></select>
<select id="daySelect"></select>
<button onclick="addRequest()">希望休</button>

<div id="shiftList"></div>

<div id="selector">
  <button onclick="setShift('早番')">早</button>
  <button onclick="setShift('日勤')">日</button>
  <button onclick="setShift('遅番')">遅</button>
  <button onclick="setShift('夜勤')">夜</button>
  <button onclick="setShift('休み')">休</button>
</div>

<script>

let staffList=["山田","佐藤","田中","鈴木"];
let requestOff={};
let shifts={},counts={},current=null;

let year=2026;
let month=3;
let days=30;

// ===== 月日生成 =====
function updateDays(){
  days=new Date(year,month+1,0).getDate();
  initDaySelect();
}

// ===== UI初期化 =====
const staffSelect=document.getElementById("staffSelect");
const daySelect=document.getElementById("daySelect");

function initUI(){
  staffSelect.innerHTML="";
  staffList.forEach(n=>{
    let o=document.createElement("option");
    o.value=n;o.textContent=n;
    staffSelect.appendChild(o);
  });
}

function initDaySelect(){
  daySelect.innerHTML="";
  for(let i=1;i<=days;i++){
    let o=document.createElement("option");
    o.value=i;o.textContent=i+"日";
    daySelect.appendChild(o);
  }
}

// ===== 年月UI =====
const ySel=document.getElementById("yearSelect");
const mSel=document.getElementById("monthSelect");

for(let y=2024;y<=2030;y++){
  let o=document.createElement("option");
  o.value=y;o.textContent=y;
  ySel.appendChild(o);
}
ySel.value=year;

for(let m=1;m<=12;m++){
  let o=document.createElement("option");
  o.value=m-1;o.textContent=m+"月";
  mSel.appendChild(o);
}
mSel.value=month;

ySel.onchange=()=>{year=Number(ySel.value);updateDays();}
mSel.onchange=()=>{month=Number(mSel.value);updateDays();}

updateDays();
initUI();

// ===== スタッフ =====
function addStaff(){
  const name=document.getElementById("newStaff").value;
  if(!name) return;
  staffList.push(name);
  initUI();
}

// ===== 希望休 =====
function addRequest(){
  const name=staffSelect.value;
  const day=Number(daySelect.value);
  if(!requestOff[name]) requestOff[name]=[];
  requestOff[name].push(day);
  render();
}

// ===== 人数取得 =====
function getMax(){
  return {
    早番:Number(document.getElementById("earlyNum").value),
    日勤:Number(document.getElementById("dayNum").value),
    遅番:Number(document.getElementById("lateNum").value),
    夜勤:Number(document.getElementById("nightNum").value)
  };
}

// ===== 判定 =====
function canAssign(name,day,type,count,max){

  if(requestOff[name]?.includes(day)){
    if(type!=="休み") return false;
  }

  if(day>1 && shifts[name][day-2]==="夜勤"){
    return type==="明け";
  }

  if(type==="明け") return false;

  if(type!=="休み" && count[type]>=max[type]) return false;

  return true;
}

// ===== バランス =====
function getBalanced(name,day,count,max){
  const order=Object.entries(counts[name])
    .sort((a,b)=>a[1]-b[1]).map(e=>e[0]);

  for(let t of order){
    if(canAssign(name,day,t,count,max)) return t;
  }
  return "休み";
}

// ===== 自動 =====
function generate(){

  const max=getMax();

  shifts={};counts={};

  staffList.forEach(n=>{
    shifts[n]=[];
    counts[n]={早番:0,日勤:0,遅番:0,夜勤:0,休み:0,明け:0};
  });

  for(let d=1;d<=days;d++){

    let count={早番:0,日勤:0,遅番:0,夜勤:0};

    staffList.forEach(n=>{

      if(d>1 && shifts[n][d-2]==="夜勤"){
        shifts[n][d-1]="明け";
        counts[n].明け++;
        return;
      }

      const s=getBalanced(n,d,count,max);

      shifts[n][d-1]=s;
      counts[n][s]++;
      if(s!=="明け") count[s]++;
    });
  }

  render();
}

// ===== 描画 =====
function render(){

  const c=document.getElementById("shiftList");
  c.innerHTML="";

  const header=document.createElement("div");
  header.className="row header";
  header.appendChild(document.createElement("div"));

  for(let i=1;i<=days;i++){
    let d=document.createElement("div");
    d.className="header-cell";

    let date=new Date(year,month,i);
    let w=["日","月","火","水","木","金","土"][date.getDay()];

    d.innerHTML=`${i}<br>${w}`;
    if(w==="土"||w==="日") d.classList.add("weekend");

    header.appendChild(d);
  }

  header.appendChild(document.createElement("div"));
  c.appendChild(header);

  staffList.forEach(n=>{
    let row=document.createElement("div");
    row.className="row";

    let nc=document.createElement("div");
    nc.className="cell name-col";
    nc.textContent=n;
    row.appendChild(nc);

    for(let i=0;i<days;i++){
      let val=shifts[n]?.[i]||"";

      let cell=document.createElement("div");
      cell.className="cell";

      if(val==="早番") cell.classList.add("early");
      if(val==="日勤") cell.classList.add("day");
      if(val==="遅番") cell.classList.add("late");
      if(val==="夜勤") cell.classList.add("night");
      if(val==="休み") cell.classList.add("off");
      if(val==="明け") cell.classList.add("ake");

      if(requestOff[n]?.includes(i+1)){
        cell.classList.add("request");
      }

      cell.innerHTML=val==="明け"?"△":val;
      row.appendChild(cell);
    }

    row.appendChild(document.createElement("div"));
    c.appendChild(row);
  });
}

// ===== CSV =====
function downloadCSV(){
  let csv="名前";
  for(let i=1;i<=days;i++) csv+=`,`+i;
  csv+="\n";

  staffList.forEach(n=>{
    let row=n;
    for(let i=0;i<days;i++){
      row+=`,`+(shifts[n]?.[i]||"");
    }
    csv+=row+"\n";
  });

  const blob=new Blob([csv]);
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="shift.csv";
  link.click();
}

// ===== 保存 =====
function saveData(){
  localStorage.setItem("shiftApp",
    JSON.stringify({staffList,requestOff,shifts,year,month})
  );
  alert("保存OK");
}

// ===== 読込 =====
function loadData(){
  const d=JSON.parse(localStorage.getItem("shiftApp"));
  if(!d) return;

  staffList=d.staffList;
  requestOff=d.requestOff;
  shifts=d.shifts;
  year=d.year;
  month=d.month;

  ySel.value=year;
  mSel.value=month;

  updateDays();
  initUI();
  render();
}

</script>
</body>
</html>
