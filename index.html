<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ShiftCare</title>

<!-- ファビコン -->
<link rel="icon" href="logo.png">

<style>
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont;
  background:#f5f5f5;
}

/* ヘッダー */
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.logo {
  display:flex;
  align-items:center;
  gap:8px;
}

.logo img {
  width:32px;
}

.logo h1 {
  font-size:20px;
  margin:0;
}

/* ボタン */
button {
  background:#007aff;
  color:#fff;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

button.secondary {
  background:#e0e0e0;
  color:#333;
}

/* カード */
.container {
  max-width:1200px;
  margin:auto;
  padding:16px;
}

.card {
  background:#fff;
  border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,0.08);
  padding:16px;
}

/* テーブル */
table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  border:1px solid #ccc;
  padding:6px;
  text-align:center;
  font-size:12px;
}

/* 色ルール */
.day { background:#fff; color:#000; }
.night { background:#cce5ff; color:#000; }
.off { background:#ffd6d6; color:#000; }
.after { background:#fff; color:#000; }

.weekend { background:#fff3cd; }
.weekend-day { background:#ffe08a; }

.wish {
  color:red !important;
  font-weight:bold;
}

/* 印刷 */
@media print {
  button { display:none; }

  @page {
    size:A4 landscape;
    margin:10mm;
  }

  table {
    font-size:9px;
  }

  th, td {
    border:1px solid #000;
    padding:3px;
  }
}
</style>
</head>

<body>

<!-- ヘッダー -->
<header class="top">
  <div class="logo">
    <img src="logo.png">
    <h1>ShiftCare</h1>
  </div>

  <div>
    <button onclick="exportCSV()">CSV</button>
    <button onclick="exportPDF()">PDF</button>
  </div>
</header>

<div class="container">
  <div class="card">

    <h2 id="monthLabel"></h2>

    <table id="shiftTable"></table>

    <p style="font-size:12px; color:#888;">
      医療・介護現場向けシフト管理ツール
    </p>

    <p style="font-size:12px; color:#888;">
      © 2026 ShiftCare
    </p>

  </div>
</div>

<script>
let currentYear = 2026;
let currentMonth = 1;
let shifts = {
  "田中": [],
  "佐藤": []
};
let holidays = {};

// 祝日取得
async function loadHolidays(year){
  let res = await fetch("https://holidays-jp.github.io/api/v1/date.json");
  let data = await res.json();

  holidays = Object.fromEntries(
    Object.entries(data).filter(([k]) => k.startsWith(year + "-"))
  );
}

// 判定
function isHoliday(y,m,d){
  let key = y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  return holidays[key];
}

// 描画
function render(){
  let days = new Date(currentYear, currentMonth, 0).getDate();

  document.getElementById("monthLabel").innerText =
    currentYear + "年 " + currentMonth + "月";

  let html = "<tr><th>名前</th>";
  for(let d=1; d<=days; d++){
    html += "<th>"+d+"</th>";
  }
  html += "</tr>";

  for(let name in shifts){
    html += "<tr><td>"+name+"</td>";

    for(let d=0; d<days; d++){
      let v = shifts[name][d] || "";

      let date = new Date(currentYear, currentMonth-1, d+1);
      let day = date.getDay();
      let isWeekend = (day===0 || day===6);
      let holiday = isHoliday(currentYear, currentMonth, d+1);

      let cls = "";

      if(v==="日") cls="day";
      if(v==="夜") cls="night";
      if(v==="休") cls="off";
      if(v==="/") cls="after";

      if(isWeekend || holiday){
        if(v==="日") cls="weekend-day";
        else cls+=" weekend";
      }

      html += `<td class="${cls}" onclick="edit('${name}',${d})">${v}</td>`;
    }

    html += "</tr>";
  }

  document.getElementById("shiftTable").innerHTML = html;
}

// 編集
function edit(name, day){
  let v = prompt("日・夜・休・/");
  shifts[name][day] = v;
  saveShift();
  render();
}

// 保存
function saveShift(){
  localStorage.setItem("shift", JSON.stringify(shifts));
}

// CSV
function exportCSV(){
  let days = new Date(currentYear, currentMonth, 0).getDate();

  let csv = "ShiftCare シフト表\n\n名前,";
  for(let d=1; d<=days; d++) csv += d + ",";
  csv += "\n";

  for(let name in shifts){
    csv += name + ",";
    for(let d=0; d<days; d++){
      csv += (shifts[name][d] || "") + ",";
    }
    csv += "\n";
  }

  download(csv, "shift.csv");
}

function download(content, filename){
  let blob = new Blob([content]);
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// PDF
function exportPDF(){
  alert("PDFとして保存してください");
  window.print();
}

// 初期化
(async()=>{
  let saved = localStorage.getItem("shift");
  if(saved) shifts = JSON.parse(saved);

  await loadHolidays(currentYear);
  render();
})();
</script>

</body>
</html>
