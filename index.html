<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフトAI</title>
<style>
body { font-family: sans-serif; padding:20px; }
table { border-collapse: collapse; }
td, th { border:1px solid #ccc; width:40px; height:40px; text-align:center; }

.day { background:#fff; }
.night { background:#87CEFA; }
.off { background:#f8c8dc; }
.after { background:#fff; }

.red { color:red; }

.name { width:90px; }
input { width:50px; }
</style>
</head>
<body>

<h2>シフトAI</h2>

年 <select id="year"></select>
月 <select id="month"></select>
<button onclick="changeMonth()">変更</button>

<br><br>

<input id="nameInput" placeholder="名前">
<button onclick="addName()">追加</button>

<br><br>

NGペア:
<input id="ng1" placeholder="A">
<input id="ng2" placeholder="B">
<button onclick="addNG()">追加</button>

<br><br>

<button onclick="toggleReq()">希望休</button>
<button onclick="toggleWish()">希望勤務</button>
<button onclick="autoFill()">自動生成</button>

<br><br>

<div id="table"></div>

<script>
let year=2026, month=4;
let names=[], shifts={}, rules={}, ngPairs=[];
let reqMode=false, wishMode=false;
let need={};

function init(){
  for(let y=2026;y<=2030;y++) yearSelect.innerHTML+=`<option>${y}</option>`;
  for(let m=1;m<=12;m++) monthSelect.innerHTML+=`<option>${m}</option>`;
  yearSelect.value=year; monthSelect.value=month;
  render();
}

function getDays(){ return new Date(year,month,0).getDate(); }

function addName(){
  const n=nameInput.value;
  if(!n) return;
  names.push(n);
  shifts[n]=Array(getDays()).fill("");
  rules[n]={max:5};
  nameInput.value="";
  render();
}

function addNG(){
  ngPairs.push([ng1.value, ng2.value]);
  ng1.value=""; ng2.value="";
}

function toggleReq(){ reqMode=!reqMode; wishMode=false; }
function toggleWish(){ wishMode=!wishMode; reqMode=false; }

function isNG(n1,n2,d,shift){
  return ngPairs.some(p =>
    ((p[0]===n1 && p[1]===n2)||(p[1]===n1 && p[0]===n2)) &&
    shifts[n2][d]===shift
  );
}

function autoFill(){
  const days=getDays();

  for(let d=0; d<days; d++){

    ["日","夜","早","遅"].forEach(type=>{

      let needNum = (need[d] && need[d][type]) || 0;

      let assigned = names.filter(n=>shifts[n][d]===type).length;

      while(assigned < needNum){

        for(let n of names){

          if(shifts[n][d]) continue;
          if(shifts[n][d+"_wish"]) continue;

          // NGチェック
          let ng=false;
          for(let other of names){
            if(other!==n && isNG(n,other,d,type)) ng=true;
          }
          if(ng) continue;

          // 連勤
          let count=0;
          for(let i=d-1;i>=0 && shifts[n][i]!=="休";i--) count++;
          if(count>=rules[n].max) continue;

          // 夜勤後
          if(shifts[n][d-1]==="夜") continue;

          shifts[n][d]=type;
          assigned++;
          break;
        }

        break;
      }
    });

    // 残りは休
    names.forEach(n=>{
      if(!shifts[n][d]) shifts[n][d]="休";
    });
  }

  render();
}

function clickCell(n,d){
  if(reqMode){
    shifts[n][d]="休";
    shifts[n][d+"_wish"]=true;
    render();
    return;
  }

  if(wishMode){
    shifts[n][d]="日";
    shifts[n][d+"_wish"]=true;
    render();
    return;
  }

  const order=["","日","夜","早","遅","休"];
  let now=shifts[n][d];
  let next=order[(order.indexOf(now)+1)%order.length];
  shifts[n][d]=next;
  shifts[n][d+"_wish"]=false;

  if(next==="夜" && d+1<getDays()) shifts[n][d+1]="/";

  render();
}

function render(){
  let html="<table>";

  html+="<tr><th>名前</th>";
  for(let d=1;d<=getDays();d++) html+=`<th>${d}</th>`;
  html+="</tr>";

  names.forEach(n=>{
    html+=`<tr><td class="name">${n}</td>`;
    for(let d=0;d<getDays();d++){
      let v=shifts[n][d];
      let cls="day";
      if(v==="夜") cls="night";
      if(v==="休") cls="off";

      html+=`<td class="${cls} ${shifts[n][d+"_wish"]?"red":""}" onclick="clickCell('${n}',${d})">${v||""}</td>`;
    }
    html+="</tr>";
  });

  // 必要人数入力
  html+="<tr><td>必要</td>";
  for(let d=0;d<getDays();d++){
    html+=`
    <td>
      日<input onchange="setNeed(${d},'日',this.value)"><br>
      夜<input onchange="setNeed(${d},'夜',this.value)"><br>
      早<input onchange="setNeed(${d},'早',this.value)"><br>
      遅<input onchange="setNeed(${d},'遅',this.value)">
    </td>`;
  }
  html+="</tr>";

  html+="</table>";
  table.innerHTML=html;
}

function setNeed(d,type,val){
  if(!need[d]) need[d]={};
  need[d][type]=parseInt(val)||0;
}

function changeMonth(){
  year=parseInt(yearSelect.value);
  month=parseInt(monthSelect.value);
  names.forEach(n=>shifts[n]=Array(getDays()).fill(""));
  render();
}

init();
</script>

</body>
</html>
