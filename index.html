<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト表</title>

<style>
* { box-sizing: border-box; }

body{
  font-family:-apple-system,BlinkMacSystemFont;
  margin:0;
  padding:20px;
  background:#f5f5f5;
}

button, select{
  padding:8px;
  margin:5px 5px 5px 0;
}

.row { display:flex; }

.cell, .header-cell{
  width:90px;
  border:1px solid #ccc;
  text-align:center;
  padding:5px;
}

.name-col{
  width:100px;
  position:sticky;
  left:0;
  background:#fff;
  z-index:10;
}

.header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:20;
}

#shiftList{ overflow-x:auto; }

.day{background:#fff;}
.night{background:#cce5ff;}
.off{background:#ffd6e7;}
.ake{background:#e0ffe0;}

.total{
  background:#f0f0f0;
  font-weight:bold;
}

#selector{
  position:fixed;
  display:none;
  background:#fff;
  border:1px solid #ccc;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>シフト表</h2>

<button onclick="generate()">自動作成</button>

<select id="shiftType">
  <option value="日勤">日勤</option>
  <option value="夜勤">夜勤</option>
  <option value="休み">休み</option>
</select>

<select id="staffSelect"></select>
<input id="dayInput" type="number" placeholder="日">
<button onclick="addRequest()">希望休追加</button>

<div id="shiftList"></div>

<!-- ポップ -->
<div id="selector">
  <button onclick="setShift('日勤')">日勤</button>
  <button onclick="setShift('夜勤')">夜勤</button>
  <button onclick="setShift('休み')">休み</button>
</div>

<script>

// ===== 設定 =====
const staffList = ["山田","佐藤","田中","鈴木"];
const days = 15;

const maxPerDay = { 日勤:2, 夜勤:1 };

let requestOff = {};
const fixedOff = {};
const ngPairs = [["山田","佐藤"]];

// ===== データ =====
let shifts = {};
let counts = {};
let current = null;

// ===== UI 初期化 =====
const staffSelect = document.getElementById("staffSelect");
staffList.forEach(n=>{
  const o=document.createElement("option");
  o.value=n;
  o.textContent=n;
  staffSelect.appendChild(o);
});

// ===== 希望休追加 =====
function addRequest(){
  const name = staffSelect.value;
  const day = Number(document.getElementById("dayInput").value);

  if(!requestOff[name]) requestOff[name]=[];
  requestOff[name].push(day);

  alert("追加したよ");
}

// ===== 判定 =====
function canAssign(name, day, type, dailyCount){

  if(fixedOff[name]?.includes(day)) return type === "休み";

  if(requestOff[name]?.includes(day)){
    if(type !== "休み") return false;
  }

  if(day>1 && shifts[name][day-2]==="夜勤"){
    return type === "明け";
  }

  if(type==="明け") return false;

  if(type==="日勤" && dailyCount.日勤>=maxPerDay.日勤) return false;
  if(type==="夜勤" && dailyCount.夜勤>=maxPerDay.夜勤) return false;

  for(let [a,b] of ngPairs){
    if(name===a && shifts[b]?.[day-1]===type) return false;
    if(name===b && shifts[a]?.[day-1]===type) return false;
  }

  return true;
}

// ===== バランス =====
function getBalancedShift(name, day, dailyCount){
  const order = Object.entries(counts[name])
    .sort((a,b)=>a[1]-b[1])
    .map(e=>e[0]);

  for(let type of order){
    if(canAssign(name, day, type, dailyCount)){
      return type;
    }
  }
  return "休み";
}

// ===== 自動生成 =====
function generate(){

  shifts={};
  counts={};

  staffList.forEach(n=>{
    shifts[n]=[];
    counts[n]={日勤:0,夜勤:0,休み:0,明け:0};
  });

  for(let day=1;day<=days;day++){

    let dailyCount={日勤:0,夜勤:0};

    staffList.forEach(name=>{

      if(day>1 && shifts[name][day-2]==="夜勤"){
        shifts[name][day-1]="明け";
        counts[name].明け++;
        return;
      }

      const shift = getBalancedShift(name,day,dailyCount);

      shifts[name][day-1]=shift;
      counts[name][shift]++;
      if(shift!=="明け") dailyCount[shift]++;
    });
  }

  render();
}

// ===== セルクリック =====
function cellClick(e,name,day){
  current={name,day};
  const s=document.getElementById("selector");
  s.style.display="block";
  s.style.top=e.clientY+"px";
  s.style.left=e.clientX+"px";
}

// ===== 手動変更 =====
function setShift(type){
  if(!current) return;

  shifts[current.name][current.day]=type;
  document.getElementById("selector").style.display="none";
  render();
}

// ===== 描画 =====
function render(){

  const c=document.getElementById("shiftList");
  c.innerHTML="";

  const header=document.createElement("div");
  header.className="row header";

  header.appendChild(document.createElement("div"));

  for(let i=1;i<=days;i++){
    const d=document.createElement("div");
    d.className="header-cell";
    d.textContent=i;
    header.appendChild(d);
  }

  const ht=document.createElement("div");
  ht.className="header-cell";
  ht.textContent="合計";
  header.appendChild(ht);

  c.appendChild(header);

  staffList.forEach(name=>{

    const row=document.createElement("div");
    row.className="row";

    const nc=document.createElement("div");
    nc.className="cell name-col";
    nc.textContent=name;
    row.appendChild(nc);

    let d=0,n=0,o=0;

    for(let i=0;i<days;i++){
      const val=shifts[name][i];

      const cell=document.createElement("div");
      cell.className="cell";
      cell.onclick=(e)=>cellClick(e,name,i);

      if(val==="日勤"){cell.classList.add("day");d++;}
      if(val==="夜勤"){cell.classList.add("night");n++;}
      if(val==="休み"){cell.classList.add("off");o++;}
      if(val==="明け"){cell.classList.add("ake");}

      cell.textContent = val==="明け"?"△":val;

      row.appendChild(cell);
    }

    const total=document.createElement("div");
    total.className="cell total";
    total.textContent=`日${d}/夜${n}/休${o}`;
    row.appendChild(total);

    c.appendChild(row);
  });

  const totalRow=document.createElement("div");
  totalRow.className="row";

  totalRow.appendChild(document.createElement("div"));

  for(let i=0;i<days;i++){
    let d=0,n=0;

    staffList.forEach(name=>{
      if(shifts[name][i]==="日勤") d++;
      if(shifts[name][i]==="夜勤") n++;
    });

    const cell=document.createElement("div");
    cell.className="cell total";
    cell.textContent=`日${d}/夜${n}`;
    totalRow.appendChild(cell);
  }

  totalRow.appendChild(document.createElement("div"));
  c.appendChild(totalRow);
}

</script>
</body>
</html>
