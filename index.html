<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>シフトAI</title>

<style>
body { font-family:sans-serif; padding:20px; }
table { border-collapse: collapse; }
td,th { border:1px solid #ccc; padding:6px; text-align:center; color:black; }

.weekend { background:#fff9c4; }
.day { background:#fff; }
.night { background:#1976d2; }
.off { background:#f8bbd0; }

.request { color:#e91e63; font-weight:bold; }

.active { background:#4caf50; color:white; }
</style>
</head>

<body>

<h2>シフトAI</h2>

年<select id="yearSelect"></select>
月<select id="monthSelect"></select>
<button onclick="changeMonth()">変更</button>

<br><br>

<input id="nameInput" placeholder="名前">
<button onclick="addName()">追加</button>

<br><br>

<button id="reqBtn" onclick="toggleReq()">希望休モード OFF</button>
<button onclick="autoFill()">自動生成</button>

<table>
<thead id="thead"></thead>
<tbody id="tbody"></tbody>
<tfoot id="tfoot"></tfoot>
</table>

<script>
let names=["佐藤","山田"];
let shifts={}, request={}, needs={}, needTypes={早:false,遅:false};
let year=2026, month=0;
let reqMode=false;

function init(){
  for(let y=2026;y<=2035;y++) yearSelect.innerHTML+=`<option>${y}</option>`;
  for(let m=0;m<12;m++) monthSelect.innerHTML+=`<option value="${m}">${m+1}</option>`;
  names.forEach(n=>shifts[n]=Array(getDays()).fill(""));
  render();
}

function getDays(){ return new Date(year,month+1,0).getDate(); }
function isHoliday(d){
  let day=new Date(year,month,d+1).getDay();
  return day===0||day===6;
}

function render(){
  let days=getDays();

  reqBtn.textContent = "希望休モード " + (reqMode?"ON":"OFF");
  reqBtn.className = reqMode?"active":"";

  let h="<tr><th>名前</th>";
  for(let d=0;d<days;d++){
    h+=`<th class="${isHoliday(d)?"weekend":""}">${d+1}</th>`;
  }
  h+="<th>合計</th></tr>";
  thead.innerHTML=h;

  let b="";
  names.forEach(n=>{
    let total=0;
    b+=`<tr><th>${n}</th>`;

    for(let d=0;d<days;d++){
      let s=shifts[n][d]||"";
      let cls="";
      if(isHoliday(d)) cls+=" weekend";
      if(["早","日","遅","明"].includes(s)) cls+=" day";
      if(s==="夜") cls+=" night";
      if(s==="休") cls+=" off";
      if(request[n]?.includes(d)) cls+=" request";

      if(["早","日","遅","夜"].includes(s)) total++;

      let disp=s==="明"?"/":s;
      b+=`<td class="${cls}" onclick="clickCell('${n}',${d})">${disp}</td>`;
    }

    b+=`<td>${total}</td></tr>`;
  });
  tbody.innerHTML=b;

  // footer
  let f="";

  // 合計
  f+="<tr><th>合計</th>";
  for(let d=0;d<days;d++){
    let c=names.filter(n=>["早","日","遅","夜"].includes(shifts[n][d])).length;
    f+=`<td>${c}</td>`;
  }
  f+="<td></td></tr>";

  // 必要人数
  f+="<tr><th>必要</th>";
  for(let d=0;d<days;d++){
    let n=needs[d]||{日:1,夜:1};
    f+=`<td>
      日<input size=1 value="${n.日||1}" onchange="setNeed(${d},'日',this.value)">
      夜<input size=1 value="${n.夜||1}" onchange="setNeed(${d},'夜',this.value)">
      ${needTypes.早 ? `早<input size=1 value="${n.早||0}" onchange="setNeed(${d},'早',this.value)">` : ""}
      ${needTypes.遅 ? `遅<input size=1 value="${n.遅||0}" onchange="setNeed(${d},'遅',this.value)">` : ""}
      <br>
      ${!needTypes.早 ? `<button onclick="addType('早')">＋早</button>` : ""}
      ${!needTypes.遅 ? `<button onclick="addType('遅')">＋遅</button>` : ""}
    </td>`;
  }
  f+="<td></td></tr>";

  tfoot.innerHTML=f;
}

function addType(t){
  needTypes[t]=true;
  render();
}

function clickCell(n,d){
  if(reqMode){
    if(!request[n]) request[n]=[];
    if(request[n].includes(d)){
      request[n]=request[n].filter(x=>x!==d);
      shifts[n][d]="";
    }else{
      request[n].push(d);
      shifts[n][d]="休";
    }
    render();
    return;
  }

  if(shifts[n][d]==="明") return;

  let order=["","早","日","遅","夜","休"];
  let cur=shifts[n][d]||"";
  let next=order[(order.indexOf(cur)+1)%order.length];
  shifts[n][d]=next;

  if(next==="夜" && d+1<getDays()){
    shifts[n][d+1]="明";
  }

  render();
}

function autoFill(){
  let days=getDays();

  for(let d=0;d<days;d++){
    let need=needs[d]||{日:1,夜:1};

    ["夜","日","早","遅"].forEach(type=>{
      if(!need[type]) return;

      while(count(d,type)<need[type]){
        let cands=names.filter(n=>!shifts[n][d] && !request[n]?.includes(d));
        if(cands.length===0) break;
        let pick=cands[Math.random()*cands.length|0];
        shifts[pick][d]=type;

        if(type==="夜" && d+1<days){
          shifts[pick][d+1]="明";
        }
      }
    });
  }

  render();
}

function count(d,t){ return names.filter(n=>shifts[n][d]===t).length; }

function setNeed(d,t,v){
  if(!needs[d]) needs[d]={};
  needs[d][t]=parseInt(v);
}

function addName(){
  let n=nameInput.value.trim();
  if(!n) return;
  names.push(n);
  shifts[n]=Array(getDays()).fill("");
  nameInput.value="";
  render();
}

function toggleReq(){
  reqMode=!reqMode;
  render();
}

function changeMonth(){
  year=parseInt(yearSelect.value);
  month=parseInt(monthSelect.value);
  names.forEach(n=>shifts[n]=Array(getDays()).fill(""));
  render();
}

init();
</script>

</body>
</html>
